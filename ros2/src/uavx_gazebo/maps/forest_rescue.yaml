# Structures at the ground station: obstacles for the planner and the referee, and the
# mast shadows the radio for a UAV low on the far side of it.
obstacles:
  - {id: GCS_SHELTER, kind: shelter, center: [-365.0, -26.0], size: [8, 4, 3], attenuation_db: 8, color: [0.85, 0.85, 0.80]}
  - {id: GCS_MAST, kind: mast, shape: cylinder, center: [-359.0, -26.0], radius: 0.12, height: 10.0, attenuation_db: 3, color: [0.7, 0.12, 0.12]}

