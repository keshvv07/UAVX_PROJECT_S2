# LEVEL 4 - two UAVs + communication
# Two UAVs on separate flight levels (25 m / 45 m: 20 m vertical separation) share three
# PoIs through the GCS. Nothing is scripted: the Stage 2 disturbance types are injected by
# the evaluator from the control console (http://localhost:8089):
#   packet loss on a UAV's links    -> ARQ keeps reports flowing
#   a short radio outage            -> GCS must NOT declare the UAV lost
#   a new emergency PoI             -> allocated at the head of a queue
#   kill a UAV (it falls)           -> GCS detects the silence and re-allocates its PoIs
# P3 is 150 m out (beyond the 100 m range): store-and-forward, as in Level 3.
level: 4
name: two_uavs_communication
description: >
  Two UAVs, GCS task allocation over the mesh radio and peer status exchange. Packet loss,
  outages, emergency PoIs and UAV failures are injected from the control console.
duration_s: 720
uavs:
  - id: uav1
    pad_m: [-25.0, -12.5]
    cruise_alt_m: 25.0
    color: [0.1, 0.6, 1.0]
    companion: {hold_m: [30.0, -20.0]}
  - id: uav2
    pad_m: [-25.0, 12.5]
    cruise_alt_m: 45.0
    color: [1.0, 0.55, 0.0]
    companion: {hold_m: [30.0, 20.0]}
components: [companion, poi_detector, radio_net, gcs, scenario_manager, control_panel, pov_viewer, mission_monitor]
mission:
  mode: gcs
companion:
  survey_s: 15.0
gcs_logic:
  fail_timeout_s: 10.0        # silence (in good coverage) before a UAV is declared lost
  poi_window_s: 300.0         # console-dropped PoIs are accepted until mission t = 300 s
pois:
  - {id: P1, pos_m: [80.0, -25.0], reported_m: [74.0, -20.0], priority: 2, survey_s: 15.0, appear_s: 0.0}
  - {id: P2, pos_m: [78.0, 35.0], reported_m: [84.0, 30.0], priority: 2, survey_s: 15.0, appear_s: 0.0}
  - {id: P3, pos_m: [150.0, -10.0], reported_m: [146.0, -4.0], priority: 3, survey_s: 15.0, appear_s: 0.0}
pass:
  all_landed: true
  allow_failure_of: injected  # only a UAV the operator killed may end FAILED
  pad_error_m: 2.0
  max_speed_mps: 5.5
  min_separation_m: 20.0
  pois_completed: all
  reports_at_gcs: all
  report_latency_s: 10.0
  ferry_pois: [P3]
  status_pdr_min: 0.5
